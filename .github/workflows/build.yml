name: Build Cinematic DOF Final

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Reconstruct final v1.0 source
        shell: bash
        run: |
          cat \
            .build/final_source.b64.part00 \
            .build/final_source.b64.part01 \
            .build/final_source.b64.part02a \
            .build/final_source.b64.part02b0 \
            .build/final_source.b64.part02b1 \
            .build/final_source.b64.part02c \
            .build/final_source.b64.part03 \
            .build/final_source.b64.part04 \
            .build/final_source.b64.part05 \
            .build/final_source.b64.part06 \
            .build/final_source.b64.part07 \
            | base64 -d > cinematic-dof-final-source.zip
          unzip -q -o cinematic-dof-final-source.zip || true
          cp .build/ConfigManager.java cinematic-dof-phase3b-1.21.11/src/client/java/com/indiancalm/cinematicdof/config/ConfigManager.java

      - name: Patch black-screen renderer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('cinematic-dof-phase3b-1.21.11/src/client/java/com/indiancalm/cinematicdof/render/DoFRenderer.java')
          s = p.read_text()

          s = s.replace(
              'import com.mojang.blaze3d.systems.RenderSystem;\nimport net.minecraft.client.MinecraftClient;\n',
              'import com.mojang.blaze3d.systems.RenderSystem;\n'
              'import com.mojang.blaze3d.textures.GpuTexture;\n'
              'import com.mojang.blaze3d.textures.GpuTextureView;\n'
              'import net.minecraft.client.MinecraftClient;\n'
              'import net.minecraft.client.gl.Framebuffer;\n'
              'import net.minecraft.client.gl.GlBackend;\n'
              'import net.minecraft.client.texture.GlTexture;\n'
          )

          replacement = '''        RenderTarget target = resolveRenderTarget(client);
              if (target == null || target.width() <= 0 || target.height() <= 0) {
                  return;
              }

              VIEWPORT.clear();
              GL11.glGetIntegerv(GL11.GL_VIEWPORT, VIEWPORT);
              int oldX = VIEWPORT.get(0);
              int oldY = VIEWPORT.get(1);
              int oldW = VIEWPORT.get(2);
              int oldH = VIEWPORT.get(3);
              int oldDraw = GL11.glGetInteger(GL30.GL_DRAW_FRAMEBUFFER_BINDING);
              int oldRead = GL11.glGetInteger(GL30.GL_READ_FRAMEBUFFER_BINDING);

              try {
                  ensureResources(target.width(), target.height());
                  copyScene(target.framebuffer(), 0, 0, target.width(), target.height());
                  drawDof(target.framebuffer(), 0, 0, target.width(), target.height(),
                          settings, client.gameRenderer.getFarPlaneDistance());
              } catch (Throwable throwable) {
                  failed = true;
                  failureReason = throwable.getClass().getSimpleName() + ": " +
                          (throwable.getMessage() == null ? "unknown rendering error" : throwable.getMessage());
                  System.err.println("[Cinematic DOF] Rendering disabled after an OpenGL error: " + failureReason);
              } finally {
                  GL30.glBindFramebuffer(GL30.GL_READ_FRAMEBUFFER, oldRead);
                  GL30.glBindFramebuffer(GL30.GL_DRAW_FRAMEBUFFER, oldDraw);
                  GL11.glViewport(oldX, oldY, oldW, oldH);
              }
          }

          private static RenderTarget resolveRenderTarget(MinecraftClient client) {
              if (!(RenderSystem.getDevice() instanceof GlBackend backend)) {
                  return null;
              }

              GpuTexture color;
              GpuTexture depth;
              GpuTextureView overrideColor = RenderSystem.outputColorTextureOverride;
              GpuTextureView overrideDepth = RenderSystem.outputDepthTextureOverride;

              if (overrideColor != null) {
                  color = overrideColor.texture();
                  depth = overrideDepth != null ? overrideDepth.texture() : null;
              } else {
                  Framebuffer framebuffer = client.getFramebuffer();
                  color = framebuffer.getColorAttachment();
                  depth = framebuffer.getDepthAttachment();
              }

              if (!(color instanceof GlTexture glColor) || depth == null) {
                  return null;
              }

              int fbo = glColor.getOrCreateFramebuffer(backend.getBufferManager(), depth);
              return new RenderTarget(fbo, color.getWidth(0), color.getHeight(0));
          }

          private record RenderTarget(int framebuffer, int width, int height) {}

          private static void ensureResources'''

          pattern = re.compile(
              r'        int targetFramebuffer = GL11\.glGetInteger\(GL30\.GL_DRAW_FRAMEBUFFER_BINDING\);.*?\n    private static void ensureResources',
              re.S
          )
          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'framebuffer render block patch count={count}')

          p.write_text(s2)
          PY

      - name: Build final Fabric mod
        working-directory: cinematic-dof-phase3b-1.21.11
        run: gradle --no-daemon clean build --stacktrace

      - name: Verify final JAR
        shell: bash
        run: |
          JAR=$(find cinematic-dof-phase3b-1.21.11/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -1)
          test -n "$JAR"
          echo "Final JAR: $JAR"
          sha256sum "$JAR"
          unzip -t "$JAR"

      - name: Upload final compiled mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-dof-black-screen-hotfix-1.21.11
          path: |
            cinematic-dof-phase3b-1.21.11/build/libs/*.jar
            !cinematic-dof-phase3b-1.21.11/build/libs/*-sources.jar
          if-no-files-found: error
