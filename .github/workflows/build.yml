name: Build Cinematic DOF Final

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Reconstruct proven Phase 3B source
        shell: bash
        run: |
          cat .build/source.b64.part* | base64 -d > cinematic-dof-source.zip
          unzip -q cinematic-dof-source.zip
          test -f cinematic-dof-phase3b-1.21.11/build.gradle

      - name: Apply final Phase 4 patch
        shell: bash
        run: |
          base64 -d .build/final_phase4.patch.gz.b64 | gzip -d > final_phase4.patch
          patch -p0 < final_phase4.patch

      - name: Build final Fabric mod
        working-directory: cinematic-dof-phase3b-1.21.11
        run: gradle --no-daemon clean build --stacktrace

      - name: Show build output
        if: always()
        shell: bash
        run: |
          find cinematic-dof-phase3b-1.21.11/build/libs -maxdepth 1 -type f -print 2>/dev/null || true

      - name: Upload final compiled mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-dof-final-1.21.11
          path: |
            cinematic-dof-phase3b-1.21.11/build/libs/*.jar
            !cinematic-dof-phase3b-1.21.11/build/libs/*-sources.jar
          if-no-files-found: error
